# API du formulaire Greentage — Cloudflare Workers
# Déploiement : voir api/README.md
name = "greentage-contact"
main = "contact-worker.js"
compatibility_date = "2026-09-01"

[vars]
# Plusieurs origines possibles, séparées par des virgules
ALLOWED_ORIGIN = "https://michprk.github.io"
SHOP_EMAIL = "info.greentage@gmail.com"
FROM_EMAIL = "Greentage <site@greentage.be>"

# Limite anti-spam par adresse IP (facultatif) :
# npx wrangler kv namespace create RATE_LIMIT  → coller l’identifiant ci-dessous
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "à-remplacer"
